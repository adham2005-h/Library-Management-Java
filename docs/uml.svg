<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><title>Library Management System class diagram</title><rect width="1150" height="1100" fill="#ffffff"/><defs><marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="white" stroke="#334155"/></marker><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#334155"/></marker></defs><path d="M270 215 L270 170 L500 170 L500 125" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#triangle)" stroke-dasharray="7 5"/><text x="285" y="158" font-family="Arial, sans-serif" font-size="16" fill="#334155">implements</text><path d="M920 215 L920 170 L680 170 L680 125" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#triangle)" stroke-dasharray="7 5"/><text x="770" y="158" font-family="Arial, sans-serif" font-size="16" fill="#334155">implements</text><path d="M185 500 L185 420 L210 420 L210 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#triangle)" /><text x="105" y="451" font-family="Arial, sans-serif" font-size="16" fill="#334155">extends</text><path d="M530 500 L530 420 L330 420 L330 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#triangle)" /><text x="545" y="451" font-family="Arial, sans-serif" font-size="16" fill="#334155">extends</text><path d="M750 300 L720 300 L720 465 L185 465 L185 500" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="440" y="455" font-family="Arial, sans-serif" font-size="16" fill="#334155">author</text><path d="M920 555 L920 400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="934" y="490" font-family="Arial, sans-serif" font-size="16" fill="#334155">books</text><path d="M750 630 L695 630" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="700" y="655" font-family="Arial, sans-serif" font-size="16" fill="#334155">students</text><path d="M920 825 L920 710" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><text x="935" y="775" font-family="Arial, sans-serif" font-size="16" fill="#334155">data</text><path d="M540 880 L750 880" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="615" y="867" font-family="Arial, sans-serif" font-size="16" fill="#334155">uses</text><g font-family="Arial, sans-serif"><rect x="440" y="25" width="300" height="100" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M440 65 H740" stroke="#334155"/><text x="590" y="52" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Interfaces</text><text x="454" y="91" font-size="15" fill="#334155">interface</text><text x="454" y="115" font-size="15" fill="#334155">+ printDetails(): void</text></g><g font-family="Arial, sans-serif"><rect x="110" y="215" width="320" height="160" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M110 255 H430" stroke="#334155"/><text x="270" y="242" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Person</text><text x="124" y="281" font-size="15" fill="#334155">abstract</text><text x="124" y="305" font-size="15" fill="#334155">- idNumber, name, gender: String</text><text x="124" y="329" font-size="15" fill="#334155">- phone, address: String</text></g><g font-family="Arial, sans-serif"><rect x="750" y="215" width="340" height="185" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M750 255 H1090" stroke="#334155"/><text x="920" y="242" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Book</text><text x="764" y="281" font-size="15" fill="#334155">- bookId, bookName, category: String</text><text x="764" y="305" font-size="15" fill="#334155">- author: Author</text><text x="764" y="329" font-size="15" fill="#334155">- price: double</text><text x="764" y="353" font-size="15" fill="#334155">- quantity: int</text><text x="764" y="377" font-size="15" fill="#334155">+ printDetails(): void</text></g><g font-family="Arial, sans-serif"><rect x="35" y="500" width="300" height="135" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M35 540 H335" stroke="#334155"/><text x="185" y="527" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Author</text><text x="49" y="566" font-size="15" fill="#334155">- email: String</text><text x="49" y="590" font-size="15" fill="#334155">- noOfBooks: int</text><text x="49" y="614" font-size="15" fill="#334155">+ printDetails(): void</text></g><g font-family="Arial, sans-serif"><rect x="365" y="500" width="330" height="135" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M365 540 H695" stroke="#334155"/><text x="530" y="527" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Student</text><text x="379" y="566" font-size="15" fill="#334155">- studentId, specialization: String</text><text x="379" y="590" font-size="15" fill="#334155">- enrolledDate: String</text><text x="379" y="614" font-size="15" fill="#334155">+ printDetails(): void</text></g><g font-family="Arial, sans-serif"><rect x="750" y="555" width="340" height="155" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M750 595 H1090" stroke="#334155"/><text x="920" y="582" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">LibraryData</text><text x="764" y="621" font-size="15" fill="#334155">- books: ArrayList&lt;Book&gt;</text><text x="764" y="645" font-size="15" fill="#334155">- students: ArrayList&lt;Student&gt;</text><text x="764" y="669" font-size="15" fill="#334155">- booksArray: Book[]</text><text x="764" y="693" font-size="15" fill="#334155">+ syncArray(): void</text></g><g font-family="Arial, sans-serif"><rect x="750" y="825" width="340" height="150" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M750 865 H1090" stroke="#334155"/><text x="920" y="852" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Process</text><text x="764" y="891" font-size="15" fill="#334155">- data: LibraryData</text><text x="764" y="915" font-size="15" fill="#334155">+ showBooks(), showStudents(): void</text><text x="764" y="939" font-size="15" fill="#334155">+ fullReport(): void</text><text x="764" y="963" font-size="15" fill="#334155">+ saveToFile(), loadFromFile(): void</text></g><g font-family="Arial, sans-serif"><rect x="110" y="830" width="430" height="100" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M110 870 H540" stroke="#334155"/><text x="325" y="857" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">FinalProject_1</text><text x="124" y="896" font-size="15" fill="#334155">+ main(String[] args): void (static)</text></g><text x="35" y="1010" font-family="Arial, sans-serif" font-size="16" fill="#475569">Dashed triangle: interface implementation | Solid triangle: inheritance | Arrow: reference or use</text><text x="35" y="1040" font-family="Arial, sans-serif" font-size="15" fill="#475569">Person, Book and LibraryData implement java.io.Serializable; Student and Author inherit it.</text><text x="35" y="1065" font-family="Arial, sans-serif" font-size="15" fill="#475569">Book.author is optional (0..1); collections contain 0..* books/students. Getters/setters omitted.</text><text x="35" y="1090" font-family="Arial, sans-serif" font-size="15" fill="#475569">Operations are summarized. No borrowing, payment integration or graphical interface.</text></svg>
