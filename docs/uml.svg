<text x="60" y="1562" class="member" >+ public   − private   |   Italic: abstract   |   Underlined: static   |   {readOnly}: final instance field</text>
<text x="60" y="1591" class="member" >Hollow triangle: inheritance (solid) / interface realization (dashed). Hollow diamond: shared aggregation.</text>
<text x="60" y="1620" class="member" >Open arrow: stored reference (solid) / dependency (dashed). 0..1: optional author; 0..*: any number of objects.</text>
<text x="60" y="1649" class="member" >booksArray is synchronized from books and holds references to the same Book objects.</text>
<text x="60" y="1678" class="member" >Constructors and routine getters/setters are omitted. Other Java-library and temporary dependencies are omitted.</text>
<text x="60" y="1703" class="member" >Student and Author inherit Interfaces and Serializable through Person. Author can exist independently of Book.</text>
